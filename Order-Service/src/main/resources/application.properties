# Order service ka port number
server.port=8082

# Service ka naam jo Eureka par dikhega
spring.application.name=order-service

# Eureka Server ka pata
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# MySQL Database Connection (Iske liye database pehle bana lena: quickserve_order)
spring.datasource.url=jdbc:mysql://localhost:3306/quickserve_order?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASS}

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
