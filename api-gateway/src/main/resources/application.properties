# Gateway ka port number (Yeh main entry point hai, isliye 8080 par chalega)
server.port=8080

# Service ka naam
spring.application.name=api-gateway

# Eureka Server ka pata
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Spring Cloud Gateway ka magic configuration (Ye automatically Eureka se services ko uthakar route bana deta hai)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
