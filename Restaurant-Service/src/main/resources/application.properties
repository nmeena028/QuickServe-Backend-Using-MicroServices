spring.application.name=Restaurant-Service

# Service ka port number (Eureka ke alag port par chalegi)
server.port=8081

# Eureka Server ka pata jahan yeh khud ko register karegi
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# MySQL Database Connection (Apna database naam aur password yahan daal lena)
spring.datasource.url=jdbc:mysql://localhost:3306/quickserve_restaurant
spring.datasource.username=root
spring.datasource.password=Nitin@2004

# Hibernate / JPA Settings (Tables automatic create karne ke liye)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
